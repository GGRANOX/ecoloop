<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mini Games — ECOLOOP</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='12' fill='%2320B879'/%3E%3Cpath d='M13 25c0-7 5-12 15-12-1 9-5 14-11 14-2 0-3-.5-4-2z' fill='%23F0FAF5'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <div id="nav"></div>
  <main id="main">
    <section class="hero page-hero">
      <div class="container reveal">
        <span class="eyebrow" style="color:var(--mint);background:rgba(154,230,180,.1)">Learn by playing</span>
        <h1>Mini <span class="grad-text">Games</span></h1>
        <p class="sub">Four independent games. Every finished round adds eco points and can unlock achievements in your profile.</p>
      </div>
      <svg class="hero-wave" viewBox="0 0 1440 60" preserveAspectRatio="none" aria-hidden="true"><path d="M0 30c240 30 480 30 720 0s480-30 720 0v30H0z" fill="currentColor"/></svg>
    </section>
    <section class="section" style="padding-top:32px">
      <div class="container">
        <div class="games-nav" role="tablist" aria-label="Choose a game">
          <button class="card game-tile hover" role="tab" data-game="tictactoe" aria-selected="true"><div class="icon-tile" data-icon="leaf"></div><h3>Eco Tic-Tac-Toe</h3><p class="muted" style="margin:0;font-size:.88rem">Leaves vs drops against a minimax bot</p></button>
          <button class="card game-tile hover" role="tab" data-game="bottle" aria-selected="false"><div class="icon-tile" data-icon="bottle"></div><h3>Bottle Toss</h3><p class="muted" style="margin:0;font-size:.88rem">Pull back, aim, throw into the right bin</p></button>
          <button class="card game-tile hover" role="tab" data-game="sortit" aria-selected="false"><div class="icon-tile" data-icon="recycle"></div><h3>Sort It!</h3><p class="muted" style="margin:0;font-size:.88rem">Drag falling waste into bins in 60 s</p></button>
          <button class="card game-tile hover" role="tab" data-game="quiz" aria-selected="false"><div class="icon-tile" data-icon="quiz"></div><h3>Eco Quiz</h3><p class="muted" style="margin:0;font-size:.88rem">10 random questions with explanations</p></button>
        </div>
        <div id="game-root" role="tabpanel" aria-live="polite"></div>
      </div>
    </section>
  </main>
  <div id="footer"></div>
  <script type="module" src="js/common.js"></script>
  <script type="module" src="js/games.js"></script>
</body>
</html>
