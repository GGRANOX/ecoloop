<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Profile — ECOLOOP</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='12' fill='%2320B879'/%3E%3Cpath d='M13 25c0-7 5-12 15-12-1 9-5 14-11 14-2 0-3-.5-4-2z' fill='%23F0FAF5'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <div id="nav"></div>
  <main id="main">
    <section class="hero page-hero">
      <div class="container profile-head reveal">
        <div class="avatar" id="p-avatar" aria-hidden="true">EH</div>
        <div style="flex:1;min-width:240px">
          <span class="eyebrow" style="color:var(--mint);background:rgba(154,230,180,.1)">Player profile</span>
          <h1 style="margin-bottom:6px"><span id="p-name">Eco Hero</span> <button class="btn btn-ghost btn-sm" id="p-rename" style="vertical-align:middle">Rename</button></h1>
          <p class="sub" style="margin:0">Level <b id="p-level">1</b> · <span id="p-next"></span></p>
          <div class="level-bar" role="progressbar" aria-label="Progress to next level" aria-valuemin="0" aria-valuemax="100" id="p-bar-wrap"><span id="p-bar" style="width:0"></span></div>
        </div>
      </div>
      <svg class="hero-wave" viewBox="0 0 1440 60" preserveAspectRatio="none" aria-hidden="true"><path d="M0 30c240 30 480 30 720 0s480-30 720 0v30H0z" fill="currentColor"/></svg>
    </section>

    <section class="section-sm">
      <div class="container grid grid-4">
        <div class="card stat"><div class="num" id="s-score">0</div><div class="lbl">eco points</div></div>
        <div class="card stat"><div class="num" id="s-level">1</div><div class="lbl">level</div></div>
        <div class="card stat"><div class="num" id="s-games">0</div><div class="lbl">games played</div></div>
        <div class="card stat"><div class="num" id="s-correct">0</div><div class="lbl">correct answers</div></div>
      </div>
    </section>

    <section class="section" style="padding-top:16px">
      <div class="container">
        <h2>Achievements <span class="muted" style="font-size:1rem" id="ach-count"></span></h2>
        <div class="grid grid-3" id="ach-grid" style="margin-top:20px"></div>

        <div class="grid grid-2" style="margin-top:48px">
          <div>
            <h2>Records</h2>
            <div class="table-wrap" style="margin-top:16px"><table id="records"></table></div>
          </div>
          <div>
            <h2>Recent activity</h2>
            <div class="table-wrap" style="margin-top:16px"><table id="history"></table></div>
          </div>
        </div>
        <div class="toolbar" style="margin-top:32px">
          <a class="btn" href="games.html"><span data-icon="game"></span> Play games</a>
          <button class="btn btn-outline" id="p-reset"><span data-icon="reset"></span> Reset progress</button>
        </div>
        <p class="muted" style="font-size:.85rem">Progress is stored only in this browser (localStorage).</p>
      </div>
    </section>
  </main>
  <div id="footer"></div>
  <script type="module" src="js/common.js"></script>
  <script type="module" src="js/profile.js"></script>
</body>
</html>
